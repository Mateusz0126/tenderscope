[project]
name = "tenderscope"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "azure-identity>=1.27.0",
    "azure-storage-file-datalake>=12.26.1",
    "httpx>=0.28.1",
    "polars>=2.1.0",
]

[project.scripts]
tenderscope = "tenderscope:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "duckdb>=2.0.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
