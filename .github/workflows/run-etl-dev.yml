name: Run ETL dev

run-name: Run ETL dev ${{ inputs.since }} to ${{ inputs.until }}

on:
  workflow_dispatch:
    inputs:
      since:
        description: First publication date (YYYY-MM-DD)
        required: true
        type: string
      until:
        description: Last publication date (YYYY-MM-DD, maximum 7 days inclusive)
        required: true
        type: string
      max_pages:
        description: Maximum pages to fetch (1-100, 50 notices per page)
        required: true
        default: "2"
        type: string

permissions:
  contents: read

concurrency:
  group: run-etl-dev
  cancel-in-progress: false

jobs:
  run:
    name: Run ETL dev
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment:
      name: dev

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Validate date window
        id: validate
        shell: bash
        env:
          SINCE: ${{ inputs.since }}
          UNTIL: ${{ inputs.until }}
          MAX_PAGES: ${{ inputs.max_pages }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from datetime import UTC, date, datetime

          since_text = os.environ["SINCE"]
          until_text = os.environ["UNTIL"]
          pages_text = os.environ["MAX_PAGES"]
          if not pages_text.isascii() or not pages_text.isdecimal() or not 1 <= int(pages_text) <= 100:
              raise SystemExit("max_pages must be an integer between 1 and 100.")

          try:
              since = date.fromisoformat(since_text)
              until = date.fromisoformat(until_text)
          except ValueError as exc:
              raise SystemExit("Dates must use the YYYY-MM-DD format.") from exc

          if since.isoformat() != since_text or until.isoformat() != until_text:
              raise SystemExit("Dates must use the YYYY-MM-DD format.")

          if since > until:
              raise SystemExit("The since date must not be after the until date.")

          window_days = (until - since).days + 1
          if window_days > 7:
              raise SystemExit("The ETL window must not exceed 7 inclusive days.")

          today_utc = datetime.now(UTC).date()
          if until >= today_utc:
              raise SystemExit("Use completed historical days only; until must be before today in UTC.")

          print(f"Validated {window_days}-day window: {since} through {until}")
          PY

      - name: Validate Azure configuration
        id: config
        shell: bash
        env:
          AZURE_ETL_CLIENT_ID: ${{ secrets.AZURE_ETL_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_JOB_NAME: ${{ vars.AZURE_JOB_NAME }}
        run: |
          set -euo pipefail
          for name in \
            AZURE_ETL_CLIENT_ID \
            AZURE_TENANT_ID \
            AZURE_SUBSCRIPTION_ID \
            AZURE_RESOURCE_GROUP \
            AZURE_JOB_NAME
          do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub environment value: ${name}" >&2
              exit 1
            fi
          done

      - name: Sign in to Azure with OIDC
        id: login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_ETL_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps CLI extension
        id: cli
        run: az extension add --name containerapp --upgrade

      - name: Prepare one-time execution template
        id: template
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_JOB_NAME: ${{ vars.AZURE_JOB_NAME }}
          SINCE: ${{ inputs.since }}
          UNTIL: ${{ inputs.until }}
          MAX_PAGES: ${{ inputs.max_pages }}
        run: |
          set -euo pipefail
          az containerapp job show \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "${AZURE_JOB_NAME}" \
            --query properties.template \
            --output json > current-template.json

          container_count="$(jq '.containers | length' current-template.json)"
          if [[ "${container_count}" != "1" ]]; then
            echo "Expected exactly one job container; found ${container_count}." >&2
            exit 1
          fi

          image="$(jq -r '.containers[0].image' current-template.json)"
          if [[ ! "${image}" =~ @sha256:[0-9a-f]{64}$ ]]; then
            echo "The job image must be pinned to an immutable SHA-256 digest." >&2
            exit 1
          fi

          echo "image=${image}" >> "${GITHUB_OUTPUT}"

          jq \
            --arg since "${SINCE}" \
            --arg until "${UNTIL}" \
            --arg max_pages "${MAX_PAGES}" \
            '.containers[0].args = [
              "--since", $since,
              "--until", $until,
              "--max-pages", $max_pages,
              "--state-policy", "enforce"
            ]' \
            current-template.json > execution-template.yaml

      - name: Start ETL execution
        id: execution
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_JOB_NAME: ${{ vars.AZURE_JOB_NAME }}
        run: |
          set -euo pipefail
          execution_name="$(
            az containerapp job start \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --name "${AZURE_JOB_NAME}" \
              --yaml execution-template.yaml \
              --query name \
              --output tsv
          )"

          if [[ -z "${execution_name}" ]]; then
            echo "Azure did not return an execution name." >&2
            exit 1
          fi

          echo "name=${execution_name}" >> "${GITHUB_OUTPUT}"
          echo "Started ${execution_name}"

      - name: Wait for ETL result
        id: wait
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_JOB_NAME: ${{ vars.AZURE_JOB_NAME }}
          EXECUTION_NAME: ${{ steps.execution.outputs.name }}
          SINCE: ${{ inputs.since }}
          UNTIL: ${{ inputs.until }}
          MAX_PAGES: ${{ inputs.max_pages }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 1800))
          status="Pending"

          while (( SECONDS < deadline )); do
            status="$(
              az containerapp job execution show \
                --resource-group "${AZURE_RESOURCE_GROUP}" \
                --name "${AZURE_JOB_NAME}" \
                --job-execution-name "${EXECUTION_NAME}" \
                --query properties.status \
                --output tsv 2>/dev/null || true
            )"

            case "${status}" in
              Succeeded)
                break
                ;;
              Failed|Stopped|Degraded)
                break
                ;;
              *)
                sleep 10
                ;;
            esac
          done

          last_status="${status:-Unknown}"
          case "${status}" in
            Succeeded|Failed|Stopped|Degraded) ;;
            *) status="TimedOut" ;;
          esac
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          echo "last_status=${last_status}" >> "${GITHUB_OUTPUT}"

          if [[ "${status}" != "Succeeded" ]]; then
            echo "ETL execution ended with status: ${status:-Timed out}" >&2
            exit 1
          fi

      - name: Summarize execution
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          SINCE: ${{ inputs.since }}
          UNTIL: ${{ inputs.until }}
          MAX_PAGES: ${{ inputs.max_pages }}
        run: |
          python - <<'PY'
          import html
          import json
          import os
          from pathlib import Path

          steps = json.loads(os.environ["STEPS_JSON"])
          failed = [name for name, step in steps.items() if step.get("outcome") in ("failure", "cancelled")]
          execution = steps.get("execution", {}).get("outputs", {}).get("name", "Not started")
          result = steps.get("wait", {}).get("outputs", {})
          rows = {
              "Requested dates": f"{os.environ['SINCE']} through {os.environ['UNTIL']}",
              "Page limit": os.environ["MAX_PAGES"],
              "Azure execution": execution,
              "Azure status": result.get("status", "Not observed"),
              "Last observed status": result.get("last_status", "Not observed"),
              "Failed workflow stages": ", ".join(failed) or "None",
              "Image": steps.get("template", {}).get("outputs", {}).get("image", "Not resolved"),
          }
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as output:
              output.write("### TenderScope ETL dev\n\n")
              for label, value in rows.items():
                  output.write(f"<p><strong>{label}:</strong> {html.escape(value)}</p>\n")
              if failed or result.get("status") != "Succeeded":
                  output.write("\nInspect the failed step and Container Apps execution logs before retrying. "
                               "A polling timeout does not stop the Azure execution. "
                               "Verify the execution and watermark before starting another run.\n")
          PY

      - name: Sign out from Azure
        if: always()
        run: az logout
